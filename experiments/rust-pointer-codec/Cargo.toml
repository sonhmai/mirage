[workspace]
members = ["crates/core", "crates/python", "crates/wasm"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
version = "0.0.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
pyo3 = { version = "0.27", features = ["abi3-py311", "extension-module"] }
wasm-bindgen = "0.2"
