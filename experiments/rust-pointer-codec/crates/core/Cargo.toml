[package]
name = "mirage-pointer-codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Cargo features unify across a test build. This makes the canonical-order tests
# exercise the map implementation another workspace crate could enable.
serde_json = { workspace = true, features = ["preserve_order"] }
